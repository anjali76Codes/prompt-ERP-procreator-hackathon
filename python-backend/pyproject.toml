[project]
name = "python-backend"
version = "0.1.0"
description = "Prompt ERP — AI agents, tools, workflows, automation, and MCP server backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.1",
    # Config / validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # HTTP client (for outbound calls to Node backend / external APIs)
    "httpx>=0.27.2",
    # Auth — verify JWTs issued by the Node backend
    "pyjwt>=2.9.0",
    # Logging
    "structlog>=24.4.0",
    # AI agents — Google Gemini
    "google-genai>=0.3.0",
    # MCP (Model Context Protocol) — server + client SDK
    "mcp>=1.0.0",
    # Browser automation (Playwright) — for "open my fee receipt" style flows
    "playwright>=1.48.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
